<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070d17">
    <title>Advay — Portfolio Coming Soon</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 25%, #111c33 0%, #070d17 70%, #04070d 100%);
            color: #f8fafc;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        canvas#snow {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        main {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            opacity: 0;
            animation: riseFade 1s ease-out 0.15s forwards, softPulse 4s ease-in-out 1.2s infinite;
        }

        p {
            margin: 0;
            font-size: clamp(1.05rem, 2.5vw, 1.35rem);
            color: #cbd5e1;
            letter-spacing: 0.02em;
            opacity: 0;
            animation: riseFade 1s ease-out 0.55s forwards;
        }

        @keyframes riseFade {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes softPulse {
            0%, 100% {
                text-shadow: 0 0 18px rgba(148, 197, 255, 0.18);
            }
            50% {
                text-shadow: 0 0 32px rgba(148, 197, 255, 0.42);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            h1,
            p {
                opacity: 1;
                animation: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="snow" aria-hidden="true"></canvas>
    <main>
        <h1>Hi, I&rsquo;m Advay</h1>
        <p>Portfolio coming up soon.</p>
    </main>

    <script>
        "use strict";
        (() => {
            const canvas = document.getElementById("snow");
            const ctx = canvas.getContext("2d");
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            let width = 0;
            let height = 0;
            let flakes = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                const count = Math.min(180, Math.max(60, Math.floor((width * height) / 11000)));
                flakes = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2.6 + 0.8,
                    speedY: Math.random() * 1.1 + 0.35,
                    drift: Math.random() * 0.6 - 0.3,
                    opacity: Math.random() * 0.6 + 0.25,
                    phase: Math.random() * Math.PI * 2
                }));
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (const f of flakes) {
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(248, 250, 252, ${f.opacity})`;
                    ctx.fill();

                    if (!reducedMotion) {
                        f.phase += 0.012;
                        f.y += f.speedY;
                        f.x += f.drift + Math.sin(f.phase) * 0.35;
                        if (f.y > height + f.r) {
                            f.y = -f.r;
                            f.x = Math.random() * width;
                        }
                        if (f.x > width + f.r) f.x = -f.r;
                        if (f.x < -f.r) f.x = width + f.r;
                    }
                }
                if (!reducedMotion) {
                    requestAnimationFrame(draw);
                }
            }

            window.addEventListener("resize", resize);
            resize();
            draw();
        })();
    </script>
</body>
</html>
